  <script type="module">
    const LANG_KEY = "claude-training:lang";
    const PROGRESS_KEY = "claude-training:progress";

    const UI = {
      tagline: {
        en: "A friendly companion for learning Claude Desktop.",
        pl: "Przyjazny przewodnik po pracy z Claude Desktop."
      },
      progressLabel: { en: "Progress: ", pl: "Postęp: " },
      skipToContent: { en: "Skip to content", pl: "Przejdź do treści" },
      conceptHeading: { en: "What this lesson is about", pl: "O czym jest ta lekcja" },
      exercisesHeading: { en: "Try it yourself", pl: "Wypróbuj sama" },
      markDone: { en: "Mark as done", pl: "Oznacz jako zrobione" },
      footer: {
        en: "Open this page in one window and Claude Desktop in another, then follow each lesson at your own pace.",
        pl: "Otwórz tę stronę w jednym oknie, a Claude Desktop w drugim — i przechodź lekcje we własnym tempie."
      }
    };

    const LESSONS = [
      {
        id: "basics",
        title: {
          en: "What is Claude + basic chatting",
          pl: "Czym jest Claude i jak z nim rozmawiać"
        },
        body: {
          en:
`Claude is an AI assistant you can chat with — a bit like texting a knowledgeable colleague who can help you write, summarise, brainstorm ideas, and explain things in plain language. You type a message (a "prompt"), Claude reads it and replies. The more clearly you describe what you want, the better the answer.

A few tips to get good results:

• Be specific. Instead of "write a Facebook post", try "write a short, friendly Facebook post about Saturday's free outdoor concert in the park, for residents of all ages".

• Give context. Tell Claude who the message is for, the tone you want, and any constraints — length, language, formality.

• Ask for changes. If the first reply isn't quite right, just say what to fix: "make it shorter", "warmer tone", "add an emoji", "more formal", "rewrite in Polish".

• Write to Claude in the language you want the answer in. If you need Polish output, write your prompt in Polish too.

You can't break anything. Try things, ask Claude to redo them, and you'll quickly get a feel for what works.`,
          pl:
`Claude to asystent AI, z którym możesz po prostu rozmawiać — trochę jak pisanie do dobrze poinformowanego kolegi, który pomoże Ci napisać, streścić, podpowiedzieć pomysł albo wytłumaczyć coś trudnego prostym językiem. Wpisujesz wiadomość (zwaną „promptem"), Claude ją czyta i odpisuje. Im jaśniej opiszesz, czego potrzebujesz, tym lepsza odpowiedź.

Kilka rad na początek:

• Bądź konkretna. Zamiast „napisz post na Facebooka" spróbuj „napisz krótki, przyjazny post na Facebooka o sobotnim bezpłatnym koncercie w parku, dla mieszkańców w każdym wieku".

• Podaj kontekst. Powiedz Claude, do kogo kierujesz wiadomość, w jakim tonie i jakie są ograniczenia — długość, język, stopień formalności.

• Proś o poprawki. Jeśli pierwsza odpowiedź nie pasuje, po prostu powiedz, co zmienić: „skróć", „cieplejszy ton", „dodaj emoji", „bardziej oficjalnie", „przetłumacz na polski".

• Pisz do Claude w języku, w jakim chcesz dostać odpowiedź. Jeśli potrzebujesz tekstu po polsku — napisz prompt po polsku.

Nic nie zepsujesz. Próbuj, proś Claude o poprawki, a szybko wyczujesz, co działa.`
        },
        exercises: [
          {
            id: "basics-1",
            title: {
              en: "Reply to a resident's question",
              pl: "Odpowiedź na pytanie mieszkanki"
            },
            prompt: {
              en:
`Open Claude Desktop and paste this prompt:

"Help me write a friendly, professional reply to a resident of Gmina Kosakowo who asks: 'When does the rubbish get collected on my street next week?' I don't have the schedule in front of me — write the reply so it is warm, but explain I will check the schedule and send the date back by tomorrow."

Read what Claude writes. Then ask Claude to make it shorter (under four sentences). Compare the two versions — which one would you actually send?`,
              pl:
`Otwórz Claude Desktop i wklej ten prompt:

„Pomóż mi napisać przyjazną i profesjonalną odpowiedź dla mieszkanki Gminy Kosakowo, która pyta: »Kiedy w przyszłym tygodniu są odbierane śmieci na mojej ulicy?«. Nie mam pod ręką harmonogramu — niech odpowiedź będzie ciepła, ale wyjaśnij, że sprawdzę harmonogram i odeślę termin do jutra."

Przeczytaj, co Claude napisze. Potem poproś Claude o skrócenie do maksymalnie czterech zdań. Porównaj obie wersje — którą naprawdę byś wysłała?`
            }
          },
          {
            id: "basics-2",
            title: {
              en: "Short Facebook post about a local event",
              pl: "Krótki post na Facebooka o lokalnym wydarzeniu"
            },
            prompt: {
              en:
`Try this prompt in Claude Desktop:

"Write a short Facebook post (max. 60 words) for the Gmina Kosakowo page announcing a free family picnic this Sunday at 14:00 in the park near the school. Friendly tone, finish with an invitation to come along. Add 2–3 fitting emojis."

Then ask Claude for two more versions in different tones — one a bit more formal, one a bit more playful. Which one fits the Gmina's Facebook best?`,
              pl:
`Wypróbuj ten prompt w Claude Desktop:

„Napisz krótki post na Facebooka (maks. 60 słów) na stronę Gminy Kosakowo, zapowiadający bezpłatny rodzinny piknik w tę niedzielę o 14:00 w parku przy szkole. Ton przyjazny, na końcu zaproszenie. Dodaj 2–3 pasujące emoji."

Następnie poproś Claude o dwie kolejne wersje w innych tonach — jedną nieco bardziej oficjalną, drugą trochę luźniejszą. Która najlepiej pasuje do Facebooka gminy?`
            }
          },
          {
            id: "basics-3",
            title: {
              en: "Warm up an over-formal message",
              pl: "Ociepl zbyt oficjalną wiadomość"
            },
            prompt: {
              en:
`Take any short, very formal message you've had to write at work — or invent one, for example: "We hereby inform residents that the office will be closed on 2 May."

Paste it into Claude Desktop with this instruction:

"Rewrite this message to be warmer and more human, while staying polite and professional. Keep it short."

Then send a second prompt asking for the same message in only two sentences. Notice how Claude can stay polite without sounding stiff.`,
              pl:
`Weź jakąś krótką, bardzo oficjalną wiadomość, którą musiałaś napisać w pracy — albo wymyśl jedną, na przykład: „Informujemy mieszkańców, że biuro będzie zamknięte 2 maja."

Wklej ją do Claude Desktop z taką instrukcją:

„Przepisz tę wiadomość tak, żeby była cieplejsza i bardziej ludzka, ale wciąż uprzejma i profesjonalna. Niech zostanie krótka."

Potem wyślij drugi prompt z prośbą o tę samą wiadomość w zaledwie dwóch zdaniach. Zauważ, jak Claude potrafi pozostać uprzejmy, nie brzmiąc sztywno.`
            }
          },
          {
            id: "basics-4",
            title: {
              en: "Iterate, don't restart",
              pl: "Iteruj, nie zaczynaj od nowa"
            },
            prompt: {
              en:
`Open Claude Desktop and start one chat. Send this first prompt:

"Napisz krótką notkę prasową (około 120 słów) ogłaszającą nową ścieżkę rowerową wzdłuż ul. Nadmorskiej w Gminie Kosakowo, otwartą w najbliższą sobotę. Ton przyjazny, ale rzeczowy."

Read what Claude writes. Now — in the same chat, not a new one — send three follow-ups, one at a time:

1. "Skróć o połowę."
2. "Dodaj jedno zdanie cytatu wójta — wymyśl je."
3. "Bardziej rzeczowy ton, mniej przymiotników."

Compare the four versions side by side. Iterating inside one conversation is almost always faster than rewriting a long prompt from scratch — and Claude keeps the context from your earlier corrections, so each next round gets closer to what you actually want.`,
              pl:
`Otwórz Claude Desktop i rozpocznij jedną rozmowę. Wyślij ten pierwszy prompt:

„Napisz krótką notkę prasową (około 120 słów) ogłaszającą nową ścieżkę rowerową wzdłuż ul. Nadmorskiej w Gminie Kosakowo, otwartą w najbliższą sobotę. Ton przyjazny, ale rzeczowy."

Przeczytaj, co Claude napisał. Teraz — w tej samej rozmowie, nie w nowej — wyślij trzy poprawki, jedna po drugiej:

1. „Skróć o połowę."
2. „Dodaj jedno zdanie cytatu wójta — wymyśl je."
3. „Bardziej rzeczowy ton, mniej przymiotników."

Porównaj cztery wersje obok siebie. Iteracja w jednej rozmowie jest prawie zawsze szybsza niż przepisywanie długiego promptu od początku — Claude pamięta Twoje wcześniejsze poprawki i z każdą kolejną wersją podchodzi bliżej tego, czego naprawdę chcesz.`
            }
          },
          {
            id: "basics-5",
            title: {
              en: "When Claude is wrong — and how to spot it",
              pl: "Kiedy Claude się myli — i jak to zauważyć"
            },
            prompt: {
              en:
`Send this prompt in Claude Desktop:

"Kiedy odbywa się najbliższa sesja Rady Gminy Kosakowo? Podaj datę, godzinę i porządek obrad."

Claude doesn't actually know — but it might confidently invent a date, a time, even names. This is called a hallucination, and it's how AI gets people into trouble at work.

Now, in the same chat, send a second prompt:

"Cofnij to. Jeśli nie masz pewności co do konkretnych dat, nazwisk lub liczb, napisz wprost »nie wiem« i wyjaśnij, czego potrzebujesz, żeby odpowiedzieć rzetelnie."

Read the second answer. The takeaway for council comms: before you publish or send anything Claude wrote, never trust dates, names, prices, statistics or quotes without checking the source yourself. A simple habit — ask Claude to cite or to say "I don't know" — catches most of these mistakes early.`,
              pl:
`Wyślij ten prompt w Claude Desktop:

„Kiedy odbywa się najbliższa sesja Rady Gminy Kosakowo? Podaj datę, godzinę i porządek obrad."

Claude tego naprawdę nie wie — ale może z dużą pewnością siebie wymyślić datę, godzinę, a nawet nazwiska. To się nazywa „halucynacja" i to przez nią AI wpędza ludzi w kłopoty w pracy.

Teraz, w tej samej rozmowie, wyślij drugi prompt:

„Cofnij to. Jeśli nie masz pewności co do konkretnych dat, nazwisk lub liczb, napisz wprost »nie wiem« i wyjaśnij, czego potrzebujesz, żeby odpowiedzieć rzetelnie."

Przeczytaj drugą odpowiedź. Wniosek dla komunikacji w urzędzie: zanim opublikujesz albo wyślesz cokolwiek, co napisał Claude, nigdy nie ufaj datom, nazwiskom, cenom, statystykom ani cytatom bez sprawdzenia w źródle. Prosty nawyk — poproś Claude'a o podanie źródła albo o jasne „nie wiem" — wyłapuje większość takich błędów zawczasu.`
            }
          }
        ]
      },
      {
        id: "projects",
        title: {
          en: "Projects in Claude Desktop",
          pl: "Projekty w Claude Desktop"
        },
        body: {
          en:
`A "Project" in Claude Desktop is a dedicated workspace for one topic, role, or recurring task. You give it a name, optionally write some custom instructions (e.g. "Always reply in friendly, slightly informal Polish, suitable for residents of a small coastal commune"), and you can add documents that Claude will keep in mind every time you chat inside that project.

Why this matters for council communications:

• Tone consistency. Write your style and tone guidance once in the project instructions, and every Facebook post, email reply, or announcement you draft inside the project follows the same voice.

• Project knowledge. Upload your style guide, a list of services and office hours, common resident questions, a glossary of Polish terms you prefer — Claude can refer to these in every conversation in the project, without you re-pasting them.

• Separate workspaces. Keep "Resident replies", "Facebook content", and "Internal briefings" in separate projects, each with its own knowledge and tone. Switching projects is like switching folders — nothing gets mixed up.

When to use a Project vs. a plain chat: use a Project when you'll come back to the same kind of work again and again. For a one-off question, a plain chat is fine.`,
          pl:
`„Projekt" w Claude Desktop to dedykowana przestrzeń pracy dla jednego tematu, roli lub powtarzalnego zadania. Nadajesz mu nazwę, opcjonalnie wpisujesz własne instrukcje (np. „Odpowiadaj zawsze przyjaznym, lekko nieformalnym polskim, odpowiednim dla mieszkańców małej nadmorskiej gminy") i możesz dodać dokumenty, o których Claude będzie pamiętał za każdym razem, gdy rozmawiasz w tym projekcie.

Dlaczego to ważne w komunikacji gminnej:

• Spójny ton. Wpiszesz swoje wskazówki dotyczące stylu raz, w instrukcjach projektu, a każdy post na Facebooku, odpowiedź na maila czy ogłoszenie tworzone w tym projekcie trzyma się tego samego głosu.

• Wiedza projektu. Wgrywasz przewodnik stylu, listę usług i godzin urzędowania, najczęstsze pytania mieszkańców, słowniczek polskich określeń, których wolisz używać — Claude może z nich korzystać w każdej rozmowie w projekcie, bez konieczności wklejania ich od nowa.

• Oddzielne przestrzenie. Trzymaj „Odpowiedzi do mieszkańców", „Treści na Facebooka" i „Briefy wewnętrzne" w osobnych projektach, każdy z własną wiedzą i tonem. Przełączanie projektów to jak zmiana folderu — niczego się nie miesza.

Kiedy projekt, a kiedy zwykła rozmowa: projekt sprawdza się tam, gdzie będziesz wracać do tego samego typu zadań. Do jednorazowego pytania wystarczy zwykła rozmowa.`
        },
        exercises: [
          {
            id: "projects-1",
            title: {
              en: "Create your first project",
              pl: "Stwórz swój pierwszy projekt"
            },
            prompt: {
              en:
`In Claude Desktop, find the Projects feature (usually in the left sidebar) and create a new project. Name it something like "Gmina Kosakowo — Komunikacja".

Open the project's custom instructions and paste something like:

"You help me write content for Gmina Kosakowo — a small coastal commune in northern Poland. Default to Polish, friendly but professional tone, slightly informal but never sloppy. Address residents as a group ('Mieszkańcy') rather than 'Państwo' unless I ask for a formal version. Keep things concise. If something is unclear, ask one short clarifying question before writing."

Save the project, start a new chat inside it, and ask: "Help me write a short greeting for our Facebook page on Mother's Day." Notice how the answer already matches the tone you set — no need to re-explain it every time.`,
              pl:
`W Claude Desktop znajdź funkcję Projekty (zwykle w lewym panelu) i utwórz nowy projekt. Nazwij go np. „Gmina Kosakowo — Komunikacja".

Otwórz instrukcje projektu i wklej coś takiego:

„Pomagasz mi tworzyć treści dla Gminy Kosakowo — małej nadmorskiej gminy w północnej Polsce. Domyślnie pisz po polsku, w przyjaznym, ale profesjonalnym tonie, lekko nieformalnie, ale nigdy niedbale. Zwracaj się do mieszkańców jako do grupy („Mieszkańcy"), a nie „Państwo", chyba że poproszę o wersję oficjalną. Bądź zwięzły. Jeśli coś jest niejasne, zadaj jedno krótkie pytanie doprecyzowujące zanim napiszesz treść."

Zapisz projekt, rozpocznij w nim nową rozmowę i zapytaj: „Pomóż mi napisać krótkie życzenia z okazji Dnia Matki na nasz Facebook." Zauważ, że odpowiedź już trzyma ton, który ustawiłaś — nie musisz wszystkiego tłumaczyć od nowa.`
            }
          },
          {
            id: "projects-2",
            title: {
              en: "Add knowledge to the project",
              pl: "Dodaj wiedzę do projektu"
            },
            prompt: {
              en:
`Open the project you just created. Find the project knowledge section (sometimes called "files" or "documents") and add a small text file with content like this — invent or copy real material:

"Gmina Kosakowo — quick reference for communications
- Office hours: Monday 8:00–16:00, Tuesday–Friday 7:30–15:30
- Most common resident questions: waste collection schedule, sports hall booking, building permits, dog registration
- Words we avoid: 'klienci' (residents are 'mieszkańcy'), 'Państwo' in casual posts
- Preferred sign-off: 'Pozdrawiamy, Urząd Gminy Kosakowo'"

Save the file into the project. Then in a new chat ask: "Draft a short reply for a resident asking when the office is open on Friday." Notice how Claude uses the actual hours from the file — without you typing them in.`,
              pl:
`Otwórz projekt, który właśnie stworzyłaś. Znajdź sekcję wiedzy projektu (czasem nazwaną „pliki" lub „dokumenty") i dodaj mały plik tekstowy z treścią taką jak poniżej — możesz wymyślić lub przepisać prawdziwy fragment:

„Gmina Kosakowo — krótka ściągawka dla komunikacji
- Godziny urzędu: poniedziałek 8:00–16:00, wtorek–piątek 7:30–15:30
- Najczęstsze pytania mieszkańców: harmonogram odbioru śmieci, rezerwacja hali sportowej, pozwolenia na budowę, rejestracja psa
- Słowa, których unikamy: „klienci" (mieszkańcy to „mieszkańcy"), „Państwo" w luźnych postach
- Preferowana stopka: „Pozdrawiamy, Urząd Gminy Kosakowo""

Zapisz plik w projekcie. Następnie w nowej rozmowie zapytaj: „Napisz krótką odpowiedź dla mieszkanki pytającej, do której godziny urząd jest czynny w piątek." Zauważ, że Claude używa konkretnych godzin z pliku — bez wpisywania ich przez Ciebie.`
            }
          },
          {
            id: "projects-3",
            title: {
              en: "Draft a series with a consistent voice",
              pl: "Stwórz serię tekstów w spójnym tonie"
            },
            prompt: {
              en:
`Inside the same project, in one chat, ask Claude to write three short Facebook posts for three different upcoming events. Invent them, for example:

1. A free outdoor yoga morning at the harbour, Saturday at 9:00.
2. A children's reading session on Thursday at 17:00 in the local library.
3. A reminder about a planned overnight road closure on the main street.

Send one prompt covering all three:

"Write three short Facebook posts for our page (max 60 words each, friendly tone) about these three events: [list them]. Match the tone of the project instructions and use the standard sign-off."

Read the three posts — they should sound like the same person wrote all of them. That's the project working. Then change one project instruction (e.g. make the tone more formal) and send the same prompt again. Notice the difference.`,
              pl:
`W tym samym projekcie, w jednej rozmowie, poproś Claude o napisanie trzech krótkich postów na Facebooka o trzech różnych nadchodzących wydarzeniach. Możesz je wymyślić, na przykład:

1. Bezpłatna joga na świeżym powietrzu w porcie, sobota godz. 9:00.
2. Czytanie dla dzieci w czwartek o 17:00 w bibliotece gminnej.
3. Przypomnienie o planowanym nocnym zamknięciu głównej ulicy.

Wyślij jeden prompt obejmujący wszystkie trzy:

„Napisz trzy krótkie posty na Facebooka na naszą stronę (maks. 60 słów każdy, przyjazny ton) o tych trzech wydarzeniach: [wymień je]. Trzymaj się tonu z instrukcji projektu i użyj standardowej stopki."

Przeczytaj trzy posty — powinny brzmieć, jakby napisała je ta sama osoba. To właśnie efekt projektu. Potem zmień jeden punkt w instrukcjach projektu (np. ustaw bardziej oficjalny ton) i wyślij ten sam prompt jeszcze raz. Zauważ różnicę.`
            }
          },
          {
            id: "projects-4",
            title: {
              en: "A briefing from multiple sources",
              pl: "Brief z kilku źródeł w jednym projekcie"
            },
            prompt: {
              en:
`Open the same project you've been using. Add two short text files to the project's knowledge — you can invent the content, close to something real:

File A — "Uchwała XX/2026 — fragment":
"§3. Mieszkańcy gminy mogą bezpłatnie korzystać z hali sportowej w soboty w godz. 9:00–13:00 po wcześniejszej rejestracji w sekretariacie. §4. Rejestracja jest ważna 30 dni."

File B — "Notatka z narady, 12 maja":
"Wójt prosi o jednostronicowy materiał dla mieszkańców wyjaśniający nowe zasady korzystania z hali. Zwrócić uwagę na rejestrację i wyjaśnić, czemu jest wymagana. Na piątek."

Now start a new chat in that project and send:

"Na podstawie obu dokumentów w projekcie przygotuj jednostronicowy materiał dla mieszkańców o nowych zasadach korzystania z hali sportowej. Wyjaśnij prostym językiem: co się zmienia, kiedy, jak się zarejestrować i dlaczego rejestracja jest potrzebna. Zakończ krótkim akapitem »Masz pytania?« z odesłaniem do sekretariatu."

Notice how Claude combines facts from both files into one coherent piece — without you re-pasting either one. That's what Projects + knowledge files unlock for any task that draws on more than one source.`,
              pl:

`"Skills" are specialised helpers built into Claude Desktop. When you ask for a particular kind of work — a Word document, a PowerPoint presentation, an Excel sheet, or anything that involves a PDF — Claude knows to use the right skill behind the scenes. You don't install anything and you usually don't need to invoke them by name.

The skills most useful for council communications work:

• Word documents (.docx). Drafts of newsletters, briefings, letters, press releases — anything that should land in your colleagues' inboxes looking like a proper document.

• PowerPoint presentations (.pptx). Slides for council meetings, public consultations, school visits, or staff training.

• Excel spreadsheets (.xlsx). Simple trackers — event sign-ups, contact lists, content calendars.

• PDFs. Reading existing council PDFs (resolutions, reports, official notices) and producing summaries or pulling out key information; also producing print-ready versions of your own content.

How to trigger a skill: describe what you want naturally. "Make me a Word document with…" or "Create a 6-slide presentation about…" is enough. Claude will produce a downloadable file you can open straight away. Ask for changes the same way — "page 2 should be bullet points instead of a paragraph", "use a friendlier tone on slide 4".`,

        id: "mcp",
        title: {
          en: "MCP — connecting Claude to other tools",
          pl: "MCP — połącz Claude'a z innymi narzędziami"
        },
        body: {
          en:
`MCP — Model Context Protocol — is the way Claude Desktop can connect to other tools and services. Without it, Claude only sees what you type or paste into chat. With it, Claude can search your Google Drive, check your calendar, look something up on the web, or read files on your computer — at your request, while you talk.

A few examples of what an MCP connection can unlock for council communications:

• "Find the PDF of the May resolution in our shared Drive and pull out the key points for a Facebook post."

• "When is our next council meeting, and who is on the agenda?" (with a Calendar connection)

• "What are other Polish coastal communes doing for tourist season this year?" (with a web search connection)

• "Open the file 'plan_komunikacji_q2.docx' from my Desktop and suggest a tighter structure."

Two things worth knowing:

1. Some connections install with one click. In Claude Desktop, Settings → Extensions → Browse lets you install many ready-made connectors (web search, calendars, common file services) yourself — no IT needed. For internal council systems or anything custom, you'll still need someone — usually IT — to install the right MCP server. Either way, once set up, it just works.

2. Trust matters. Some MCP servers are official (Anthropic, Google), others are community-built. Treat them like any other software a workplace adopts — ask what it accesses, where the data goes, and who is responsible.

This lesson is about understanding what MCP is and what it could change in your day. Some connections you can set up yourself in one click; others (internal systems) need your IT team. The exercises below help you see what's already on, prepare a concrete ask for things you can't install yourself, and try a one-click extension on your own.`,
          pl:
`MCP — Model Context Protocol — to sposób, w jaki Claude Desktop może łączyć się z innymi narzędziami i usługami. Bez MCP Claude widzi tylko to, co wpiszesz lub wkleisz w rozmowie. Z MCP Claude może przeszukać Twój Google Drive, sprawdzić kalendarz, znaleźć coś w internecie albo otworzyć plik na komputerze — na Twoją prośbę, w trakcie rozmowy.

Kilka przykładów, co MCP może otworzyć w pracy komunikacyjnej:

• „Znajdź PDF majowej uchwały na naszym wspólnym Dysku i wyciągnij z niej kluczowe punkty do posta na Facebooka."

• „Kiedy mamy następną sesję rady i kto jest w porządku obrad?" (przy podłączonym Kalendarzu)

• „Co inne polskie gminy nadmorskie robią w tym roku na sezon turystyczny?" (przy podłączonym wyszukiwaniu internetowym)

• „Otwórz plik »plan_komunikacji_q2.docx« z mojego pulpitu i zaproponuj zwartszą strukturę."

Dwie rzeczy warto wiedzieć:

1. Część połączeń instaluje się jednym kliknięciem. W Claude Desktop wejdź w Settings → Extensions → Browse — wiele gotowych rozszerzeń (wyszukiwanie internetowe, kalendarze, popularne usługi plikowe) zainstalujesz sama, bez pomocy informatyka. Do wewnętrznych systemów urzędu albo czegokolwiek niestandardowego nadal potrzebna będzie osoba z IT, żeby zainstalować odpowiedni serwer MCP. Tak czy inaczej — raz skonfigurowane, po prostu działa.

2. Liczy się zaufanie. Część serwerów MCP jest oficjalna (Anthropic, Google), część została zbudowana przez społeczność. Traktuj je jak każde inne oprogramowanie wprowadzane do pracy — pytaj, do czego mają dostęp, gdzie trafiają dane i kto za nie odpowiada.

Ta lekcja jest o zrozumieniu, czym jest MCP i co mogłoby się zmienić w Twoim dniu pracy. Niektóre rozszerzenia ustawisz sama jednym kliknięciem; te dla wewnętrznych systemów wymagają zespołu IT. Poniższe ćwiczenia pomogą Ci zobaczyć, co już masz włączone, przygotować konkretną prośbę o to, czego nie zainstalujesz sama, oraz spróbować jednego rozszerzenia samodzielnie.`

              pl:
`To ćwiczenie zrobisz bez pomocy informatyka.

W Claude Desktop otwórz Settings → Extensions i kliknij „Browse extensions". Zobaczysz katalog rozszerzeń instalowanych jednym kliknięciem, sprawdzonych przez Anthropic. Wybierz jedno, które wygląda przydatnie — bezpieczny start to „Web Search" (Claude może szukać w internecie) albo „Filesystem" (Claude może czytać pliki z folderu, który mu wskażesz).

Kliknij Install. Zatwierdź prośby o uprawnienia. Jeśli aplikacja poprosi — uruchom ją ponownie.

Teraz sprawdź, jak to działa, w nowej rozmowie:

• Jeśli zainstalowałaś Web Search: „Sprawdź w internecie, co inne polskie gminy nadmorskie planują na sezon turystyczny w tym roku. Wymień 5 konkretnych przykładów z nazwami gmin i krótkim opisem."

• Jeśli zainstalowałaś Filesystem: wskaż folder zawierający wyłącznie pliki bez danych wrażliwych i zapytaj: „Zajrzyj do folderu, który Ci wskazałam. Wypisz pliki i napisz krótko, co każdy z nich wygląda na to, że zawiera."

Zauważ różnicę: Claude czyta teraz świat, nie tylko rozmowę. Dwie ważne uwagi: instaluj tylko te rozszerzenia, których naprawdę potrzebujesz, a do „Filesystem" podchodź ostrożnie — nigdy nie kieruj go na foldery z danymi osobowymi mieszkańców, skanami pism ani niczym, co obejmuje RODO.`
            }
          }
        ]
      }
    ];

    const getLang = () => localStorage.getItem(LANG_KEY) === "en" ? "en" : "pl";

    const setLang = (lang) => {
      const normalized = lang === "en" ? "en" : "pl";
      localStorage.setItem(LANG_KEY, normalized);
      document.documentElement.lang = normalized;
    };

    const getProgress = () => {
      try {
        return JSON.parse(localStorage.getItem(PROGRESS_KEY)) || {};
      } catch {
        return {};
      }
    };

    const markDone = (exerciseId, done = true) => {
      const progress = getProgress();
      if (done) progress[exerciseId] = true;
      else delete progress[exerciseId];
      localStorage.setItem(PROGRESS_KEY, JSON.stringify(progress));
    };

    const t = (field) => field?.[getLang()] ?? "";

    const escapeHtml = (s) => String(s)
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#39;");

    let activeLessonId = LESSONS[0].id;

    function renderStaticLabels() {
      document.querySelectorAll("[data-i18n]").forEach(el => {
        const key = el.dataset.i18n;
        if (UI[key]) el.textContent = t(UI[key]);
      });
      document.getElementById("langLabel").textContent = getLang() === "en" ? "PL" : "EN";
      document.title = getLang() === "pl"
        ? "Claude Training — Nauka Claude Desktop"
        : "Claude Training — Learn Claude Desktop";
    }

    function renderProgress() {
      const total = LESSONS.reduce((sum, l) => sum + l.exercises.length, 0);
      const done = Object.keys(getProgress()).length;
      const pct = total ? Math.round((done / total) * 100) : 0;
      document.getElementById("progressBar").style.width = pct + "%";
      document.getElementById("progressCount").textContent = `${done}/${total}`;
    }

    function renderNav() {
      const progress = getProgress();
      const nav = document.getElementById("lessonNav");
      nav.innerHTML = LESSONS.map(lesson => {
        const doneCount = lesson.exercises.filter(e => progress[e.id]).length;
        const total = lesson.exercises.length;
        const complete = total > 0 && doneCount === total;
        const active = lesson.id === activeLessonId;
        const baseClasses = "block w-full text-left px-3 py-2 rounded min-h-[44px] focus:outline-none focus:ring-2 focus:ring-slate-500";
        const stateClasses = active
          ? "bg-slate-900 text-white"
          : "bg-white border border-slate-200 hover:bg-slate-100";
        const badge = complete
          ? `<span aria-hidden="true" class="text-emerald-500">✓</span>`
          : `<span aria-hidden="true" class="text-xs ${active ? "text-slate-300" : "text-slate-500"} tabular-nums">${doneCount}/${total}</span>`;
        return `
          <button type="button" data-lesson="${escapeHtml(lesson.id)}"
                  class="${baseClasses} ${stateClasses}"
                  aria-current="${active ? "page" : "false"}">
            <span class="flex items-center justify-between gap-2">
              <span class="font-medium">${escapeHtml(t(lesson.title))}</span>
              ${badge}
            </span>
          </button>`;
      }).join("");
    }

    function renderLesson() {
      const progress = getProgress();
      const lesson = LESSONS.find(l => l.id === activeLessonId) ?? LESSONS[0];
      const main = document.getElementById("main");
      const exercisesHtml = lesson.exercises.map((ex, i) => {
        const checked = progress[ex.id] ? "checked" : "";
        return `
          <li class="border border-slate-200 rounded-lg p-4">
            <div class="flex items-start justify-between gap-4 mb-3 flex-wrap">
              <h4 class="font-semibold text-base">${i + 1}. ${escapeHtml(t(ex.title))}</h4>
              <label class="inline-flex items-center gap-2 cursor-pointer min-h-[44px] select-none">
                <input type="checkbox" data-exercise="${escapeHtml(ex.id)}" ${checked}
                       class="w-5 h-5 rounded border-slate-400 text-emerald-600 focus:ring-emerald-500" />
                <span class="text-sm text-slate-700">${escapeHtml(t(UI.markDone))}</span>
              </label>
            </div>
            <p class="whitespace-pre-line leading-relaxed text-slate-700">${escapeHtml(t(ex.prompt))}</p>
          </li>`;
      }).join("");

      main.innerHTML = `
        <article>
          <h2 class="text-2xl sm:text-3xl font-bold mb-4">${escapeHtml(t(lesson.title))}</h2>
          <section class="mb-8">
            <h3 class="text-xs uppercase tracking-wider text-slate-500 font-semibold mb-2">${escapeHtml(t(UI.conceptHeading))}</h3>
            <div class="whitespace-pre-line leading-relaxed text-slate-800">${escapeHtml(t(lesson.body))}</div>
          </section>
          ${lesson.exercises.length ? `
            <section>
              <h3 class="text-xs uppercase tracking-wider text-slate-500 font-semibold mb-3">${escapeHtml(t(UI.exercisesHeading))}</h3>
              <ol class="space-y-4">${exercisesHtml}</ol>
            </section>
          ` : ""}
        </article>`;
    }

    function render() {
      renderStaticLabels();
      renderProgress();
      renderNav();
      renderLesson();
    }

    document.documentElement.lang = getLang();

    document.getElementById("langToggle").addEventListener("click", () => {
      setLang(getLang() === "en" ? "pl" : "en");
      render();
    });

    document.getElementById("lessonNav").addEventListener("click", (e) => {
      const btn = e.target.closest("[data-lesson]");
      if (!btn) return;
      activeLessonId = btn.dataset.lesson;
      render();
      document.getElementById("main").focus();
    });

    document.getElementById("main").addEventListener("change", (e) => {
      const input = e.target.closest("[data-exercise]");
      if (!input) return;
      markDone(input.dataset.exercise, input.checked);
      renderNav();
      renderProgress();
    });

    render();
  </script>
</body>
</html>
